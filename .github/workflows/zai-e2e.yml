name: Teste real da Z.ai

# Roda sob demanda: Actions > "Teste real da Z.ai" > Run workflow.
# Requer o secret ZAI_API_KEY (Settings > Secrets and variables > Actions).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Teste ponta a ponta com a chave real
        run: npm run test:e2e:zai
        env:
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
