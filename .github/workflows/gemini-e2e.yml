name: Teste real do Gemini

# Roda sob demanda: Actions > "Teste real do Gemini" > Run workflow.
# Requer o secret GEMINI_API_KEY (Settings > Secrets and variables > Actions).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Teste ponta a ponta com a chave real
        run: npm run test:e2e
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
