name: CI

on:
  push:
    branches: [main, melhorias-alphavision]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Checar tipos
        run: npx tsc --noEmit
      - name: Lint
        run: npx next lint --max-warnings 0
      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
